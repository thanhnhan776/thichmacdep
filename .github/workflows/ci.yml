name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - name: Enable pnpm and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm typecheck:api

      - name: Test API
        run: pnpm test:api

      - name: Test sync
        run: pnpm test:sync

      - name: Test storefront
        run: pnpm test:storefront

      - name: Test storefront SSR
        run: pnpm test:storefront:ssr

      - name: Test storefront catalog
        run: pnpm test:storefront:catalog

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - name: Enable pnpm and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build storefront
        run: pnpm build:storefront
