name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - name: Enable pnpm and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm typecheck:api

      - name: Test API
        run: pnpm test:api

      - name: Test sync
        run: pnpm test:sync

      - name: Test storefront
        run: pnpm test:storefront

      - name: Test storefront SSR
        run: pnpm test:storefront:ssr

      - name: Test storefront catalog
        run: pnpm test:storefront:catalog

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - name: Enable pnpm and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build storefront
        run: pnpm build:storefront
